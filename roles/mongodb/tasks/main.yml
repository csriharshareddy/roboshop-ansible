---
- name: setting prompt
  ansible.builtin.shell: set-prompt {{component_name}}

- name: creating mongodb repo
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: installing MongoDB
  ansible.builtin.dnf:
    name: mongodb-org
    state: installed

- name: MongoDB config
  ansible.builtin.lineinfile:
    path: /etc/mongod.conf
    regexp: '127.0.0.1'
    line: ' 0.0.0.0'

- name: enable and restart mongod
  ansible.builtin.systemd_service:
    name: mongod
    enabled: true
    state: restarted
    